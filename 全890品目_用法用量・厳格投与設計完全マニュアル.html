  let currentFilter = 'all';

  function renderTable() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const tbody = document.getElementById('tableBody');
    
    const filtered = masterData.filter(d => {
      // フィルター判定
      if (currentFilter === 'no_adjust' && !d.no_adjust_status.includes('適宜増減なし')) return false;
      if (currentFilter === 'renal' && d.renal_adjustment === '特記事項なし（常用量）') return false;
      if (currentFilter === 'step' && d.step_titration === '特記事項なし') return false;
      if (currentFilter === 'timing' && d.timing_strict === '通常食後等') return false;
      if (currentFilter === 'interaction' && d.interaction_dose_rule === '特記事項なし') return false;
      if (currentFilter === 'weight' && d.weight_dosing === '特記事項なし') return false;

      // 検索クエリ判定
      if (!query) return true;
      const targetStr = (d.name + ' ' + d.generic + ' ' + d.category + ' ' + d.dosage_standard + ' ' + d.renal_adjustment + ' ' + d.step_titration + ' ' + d.timing_strict + ' ' + d.interaction_dose_rule).toLowerCase();
      return targetStr.includes(query);
    });

    tbody.innerHTML = filtered.map(item => {
      const isNoAdjust = item.no_adjust_status.includes('適宜増減なし');
      const badgeClass = isNoAdjust ? 'badge-danger' : 'badge-success';

      return `
        <tr>
          <td style="min-width: 140px;">
            <strong style="color:var(--primary); font-size:13px;">${item.name}</strong>
            <div style="color:#64748b; font-size:11px; margin-top:2px;">${item.generic}</div>
            <div style="color:#94a3b8; font-size:10px;">${item.maker}</div>

          <td>
            <span class="badge ${badgeClass}">${isNoAdjust ? '増減なし' : '増減可'}</span>
          </td>
          <td style="min-width: 180px; font-size:11.5px; line-height:1.4;">
            ${item.dosage_standard}
          </td>
          <td style="min-width: 150px; font-size:11.5px;">
            ${item.renal_adjustment !== '特記事項なし（常用量）' ? '<span style="color:var(--danger); font-weight:600;">' + item.renal_adjustment + '</span>' : '<span style="color:#94a3b8;">-</span>'}
          </td>
          <td style="min-width: 140px; font-size:11.5px;">
            ${item.step_titration !== '特記事項なし' ? '<span style="color:var(--accent); font-weight:600;">' + item.step_titration + '</span>' : '<span style="color:#94a3b8;">-</span>'}

          <td style="min-width: 120px; font-size:11.5px;">

          </td>
          <td style="min-width: 160px; font-size:11.5px;">
            ${item.interaction_dose_rule !== '特記事項なし' ? '<span style="color:#7c3aed; font-weight:600;">' + item.interaction_dose_rule + '</span>' : '<span style="color:#94a3b8;">-</span>'}
          </td>
        </tr>
      `;
    }).join('');
  }

  function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
